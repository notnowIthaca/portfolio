<!-- Footer -->
<footer>
<div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">

                <ul class="list-inline text-center">
                    
                    <!-- ADD Zhihu -->
                    {% if site.zhihu_username %}
                    <li>
                        <a href="https://zhihu.com/people/{{ site.zhihu_username }}/posts" data-toggle="tooltip"
                            style="color:#dddddd" target="_blank" title="Zhihu">
                        <span class="fa-stack fa-lg"> 
                        <svg style="vertical-align: -5%;"
                             viewBox="0 0 31 30" fill="#dddddd" width="24" height="24">
                            <g>
                            <path d="M29.05 4.582H16.733V25.94h3.018l.403 2.572 4.081-2.572h4.815V4.582zm-5.207 18.69l-2.396 1.509-.235-1.508h-1.724V7.233h6.78v16.04h-2.425zM14.46 14.191H9.982c0-.471.033-.954.039-1.458v-5.5h5.106V5.935a1.352 1.352 0 0 0-.404-.957 1.378 1.378 0 0 0-.968-.396H5.783c.028-.088.056-.177.084-.255.274-.82 1.153-3.326 1.153-3.326a4.262 4.262 0 0 0-2.413.698c-.57.4-.912.682-1.371 1.946-.532 1.453-.997 2.856-1.31 3.693C1.444 8.674.28 11.025.28 11.025a5.85 5.85 0 0 0 2.52-.61c1.119-.593 1.679-1.502 2.054-2.883l.09-.3h2.334v5.5c0 .5-.045.982-.073 1.46h-4.12c-.71 0-1.39.278-1.893.775a2.638 2.638 0 0 0-.783 1.874h6.527a17.717 17.717 0 0 1-.778 3.649 16.796 16.796 0 0 1-3.012 5.273A33.104 33.104 0 0 1 0 28.74s3.13 1.175 5.425-.954c1.388-1.292 2.631-3.814 3.23-5.727a28.09 28.09 0 0 0 1.12-5.229h5.967v-1.37a1.254 1.254 0 0 0-.373-.899 1.279 1.279 0 0 0-.909-.37z"></path>
                            <path d="M11.27 19.675l-2.312 1.491 5.038 7.458a6.905 6.905 0 0 0 .672-2.218 3.15 3.15 0 0 0-.28-2.168"></path>
                            </g>
                        </svg>
                        </span>
                        </a>
                    </li>
                    {% endif %}

                <!-- ADD Sketchfab -->
                {% if site.sketchfab_username %}
                <li>
                    <a href="https://sketchfab.com/{{ site.sketchfab_username }}" data-toggle="tooltip"
                         target="_blank" title="Sketchfab">
                    <span class="fa-stack fa-lg">
                        <svg style="vertical-align: -5%;"
                             viewBox="0 0 25 25" fill="#dddddd" width="24" height="24">    
                        <g>
                            <path fill="transparent"
                                d="M12.5,0.833C6.056,0.833,0.834,6.057,0.834,12.5S6.056,24.167,12.5,24.167S24.167,18.943,24.167,12.5 S18.944,0.833,12.5,0.833z">
                            </path>
                        </g>
                        <g>
                            <path 
                                d="M12.5-0.029C5.596-0.029,0,5.568,0,12.472c0,6.904,5.596,12.501,12.5,12.501s12.5-5.597,12.5-12.501 C25.001,5.568,19.405-0.029,12.5-0.029z M11.414,19.911L6.025,16.8v-6.276l5.389,2.911V19.911z M12.374,11.958l-6.376-3.38 l6.376-3.682l6.377,3.682L12.374,11.958z M18.755,16.812l-5.369,3.1v-6.452l5.369-2.901V16.812z">
                            </path>
                        </g>
                        </svg>
                    </span>
                    </a>
                </li>
                {% endif %}


                {% if site.github_username %}
                    <li>
                        <a href="https://github.com/{{ site.github_username }}" data-toggle="tooltip" 
                            target="_blank" title="Github">
                            <span class="fa-stack fa-lg">
                                <i class="fa fa-circle fa-stack-2x"></i>
                                <i class="fa fa-github fa-stack-1x fa-inverse"></i>
                            </span>
                        </a>
                    </li>
                {% endif %}



            


                </ul>
                <p class="copyright text-muted">Copyright &copy; {{ site.title }} {{ site.time | date: '%Y' }}</p>
<center><h6><p>Powered by <a href="https://github.com/jekyll/">Jekyll</a>.</p></h6></center>
            </div>
        </div>
    </div>
</footer>
